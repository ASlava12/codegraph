name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install the libraries the desktop window needs
        run: |
          # `codegraph-ui` is a tao/wry window, and on linux that means GTK
          # and WebKit. Without them the workspace stops at `glib-sys`
          # before a single check runs, which is every red run this
          # repository has ever had. macOS builds the same crate against
          # frameworks the system already carries, so this is the one
          # platform that has to say it out loud.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Check web JavaScript syntax
        run: |
          node --check crates/codegraph-web/static/label-policy.js
          for module in crates/codegraph-web/static/js/*.js; do
            node --check "$module"
          done

      - name: Run web JavaScript tests
        run: node --test crates/codegraph-web/static/label-policy.test.js

      - name: Guard the concatenated bundle
        run: |
          node crates/codegraph-web/static/check-defs.mjs
          node crates/codegraph-web/static/flow-smoke.mjs
          node crates/codegraph-web/static/views-smoke.mjs

      - name: Build Docker image
        run: docker build -t codegraph:ci .

      - name: Smoke Docker image
        run: |
          docker volume rm codegraph-ci-cache >/dev/null 2>&1 || true
          docker run --rm -d \
            --name codegraph-ci \
            -p 127.0.0.1:3766:3765 \
            -v "$PWD:/workspace:ro" \
            -v codegraph-ci-cache:/cache \
            codegraph:ci
          cleanup() {
            docker rm -f codegraph-ci >/dev/null 2>&1 || true
            docker volume rm codegraph-ci-cache >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3766/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          curl -fsS http://127.0.0.1:3766/api/live | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (body.status !== "ok" || body.cache_enabled !== true) process.exit(1); });'
          curl -fsS http://127.0.0.1:3766/api/ready | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (body.status !== "ready" || body.root !== "/workspace") process.exit(1); });'
          curl -fsS http://127.0.0.1:3766/api/schema | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); const endpoints = body.groups.flatMap(group => group.endpoints); if (!endpoints.some(endpoint => endpoint.path === "/api/graph")) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3766/api/summary?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (typeof body.nodes !== "number" || typeof body.edges !== "number") process.exit(1); });'

      - name: Smoke scan CLI
        run: |
          # --no-semantic keeps CI reproducible: the automatic semantic pass
          # depends on which language servers the runner happens to have.
          cargo run -p codegraph-cli -- scan . --no-semantic --format ndjson > /tmp/codegraph.ndjson
          test -s /tmp/codegraph.ndjson
          grep '"record_type":"graph"' /tmp/codegraph.ndjson

      - name: Check the browser and the CLI agree on findings
        run: |
          # The browser recomputes some findings itself when no report has
          # been sent, and those copies drift: flask's ten client warnings
          # against the CLI's one warning and eight notes went unnoticed
          # until someone drove both over a real graph. The fixtures in
          # views-smoke.mjs pin each rule; this compares the counts on this
          # repository's own graph.
          cargo run -p codegraph-cli -- scan . --no-semantic --no-cache > /tmp/parity-graph.json
          cargo run -p codegraph-cli -- insights . --no-semantic --no-cache --limit 1 > /tmp/parity-kinds.json
          cargo run -p codegraph-cli -- insights . --no-semantic --no-cache --severity warning --limit 500 > /tmp/parity-warnings.json
          node crates/codegraph-web/static/insight-parity.mjs \
            /tmp/parity-graph.json /tmp/parity-kinds.json /tmp/parity-warnings.json

      - name: Check scan determinism
        run: |
          # The cache, the byte-stable wiki export and every diff of two
          # reports rest on one property: the same tree scans to the same
          # bytes, whether the facts come from a cold walk or from the
          # cache. --no-semantic keeps the runner's language servers out.
          cache_dir="$(mktemp -d)"
          cargo run -p codegraph-cli -- scan . --no-semantic --no-cache > /tmp/scan-a.json
          cargo run -p codegraph-cli -- scan . --no-semantic --no-cache > /tmp/scan-b.json
          cargo run -p codegraph-cli -- scan . --no-semantic --cache-dir "$cache_dir" > /tmp/scan-cold.json
          cargo run -p codegraph-cli -- scan . --no-semantic --cache-dir "$cache_dir" > /tmp/scan-warm.json
          cmp /tmp/scan-a.json /tmp/scan-b.json
          cmp /tmp/scan-a.json /tmp/scan-cold.json
          cmp /tmp/scan-cold.json /tmp/scan-warm.json

      - name: Smoke server cache
        run: |
          cache_dir="$(mktemp -d)"
          cargo run -p codegraph-server -- --root . --port 3765 --cache-dir "$cache_dir" &
          server_pid="$!"
          trap 'kill "$server_pid"' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          curl -fsS 'http://127.0.0.1:3765/' -o /tmp/codegraph-index.html
          grep '<script src="/label-policy.js"></script>' /tmp/codegraph-index.html
          grep '<script src="/app.js"></script>' /tmp/codegraph-index.html
          label_line="$(grep -n '<script src="/label-policy.js"></script>' /tmp/codegraph-index.html | cut -d: -f1)"
          app_line="$(grep -n '<script src="/app.js"></script>' /tmp/codegraph-index.html | cut -d: -f1)"
          test "$label_line" -lt "$app_line"

          curl -fsS -D /tmp/codegraph-label-policy.headers 'http://127.0.0.1:3765/label-policy.js' -o /tmp/codegraph-label-policy.js
          grep -i '^content-type: application/javascript' /tmp/codegraph-label-policy.headers
          node --check /tmp/codegraph-label-policy.js
          curl -fsS -D /tmp/codegraph-app.headers 'http://127.0.0.1:3765/app.js' -o /tmp/codegraph-app.js
          grep -i '^content-type: application/javascript' /tmp/codegraph-app.headers
          node --check /tmp/codegraph-app.js
          curl -fsS -D /tmp/codegraph-styles.headers 'http://127.0.0.1:3765/styles.css' -o /tmp/codegraph-styles.css
          grep -i '^content-type: text/css' /tmp/codegraph-styles.headers
          grep '.graph-stage' /tmp/codegraph-styles.css

          first="$(curl -fsS 'http://127.0.0.1:3765/api/scan?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).cache.status));')"
          second="$(curl -fsS 'http://127.0.0.1:3765/api/scan?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).cache.status));')"
          test "$first" = "miss"
          test "$second" = "hit"
          incremental_fixture="$(mktemp -d "$PWD/codegraph-incremental.XXXXXX")"
          mkdir -p "$incremental_fixture/src"
          cat > "$incremental_fixture/src/main.rs" <<'RS'
          fn main() { let value = 1; }
          RS
          cat > "$incremental_fixture/src/stable.rs" <<'RS'
          pub fn stable() {}
          RS
          curl -fsS "http://127.0.0.1:3765/api/scan?path=$incremental_fixture" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (body.cache.status !== "miss") process.exit(1); });'
          cat > "$incremental_fixture/src/main.rs" <<'RS'
          fn main() { let value = 2; }
          RS
          curl -fsS -X POST "http://127.0.0.1:3765/api/incremental-update?path=$incremental_fixture&limit=10" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!body.cache.stored || body.preview.plan.action !== "partial_rescan" || !body.preview.merge.complete_graph || body.preview.merge.completeness_blockers.length !== 0) process.exit(1); });'
          curl -fsS "http://127.0.0.1:3765/api/scan?path=$incremental_fixture" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (body.cache.status !== "hit") process.exit(1); });'
          rm -rf "$incremental_fixture"
          curl -fsS 'http://127.0.0.1:3765/api/summary?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (typeof body.nodes !== "number" || !body.languages || !body.edge_confidences) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/entrypoints?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body)) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=10&kind=function' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || typeof body.total_nodes !== "number") process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=10&language=rust' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || body.nodes.some(node => node.metadata && node.metadata.language && node.metadata.language !== "rust")) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=10&item_kind=function&search=scan' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || body.nodes.length < 1 || body.nodes.some(node => node.metadata && node.metadata.item_kind && node.metadata.item_kind !== "function")) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=50&edge_limit=10&confidence=exact' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.edges) || body.edges.some(edge => edge.confidence !== "exact")) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/focus?path=.&node_ids=1&edge_limit=10' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || body.nodes.length < 1 || !Array.isArray(body.edges)) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/insights?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (typeof body.total !== "number" || !Array.isArray(body.insights)) process.exit(1); });'
          curl -fsS --get 'http://127.0.0.1:3765/api/query' --data-urlencode 'path=.' --data-urlencode 'q=edges confidence:heuristic limit:5' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.edges) || body.edges.some(edge => edge.confidence !== "heuristic")) process.exit(1); });'
          curl -fsS --get 'http://127.0.0.1:3765/api/query' --data-urlencode 'path=.' --data-urlencode 'q=path from:main to:scan_with_options depth:4' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || !Array.isArray(body.edges) || body.edges.length < 1) process.exit(1); });'
          fixture="$(mktemp -d "$PWD/codegraph-fixture.XXXXXX")"
          cat > "$fixture/main.rs" <<'RS'
          fn main() { service(); }
          fn service() { repository(); }
          fn repository() { main(); }
          RS
          curl -fsS "http://127.0.0.1:3765/api/insights?path=$fixture" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!body.insights.some(insight => insight.kind === "dependency_cycle")) process.exit(1); });'
          node_id="$(curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=1&kind=function' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).nodes[0].id));')"
          curl -fsS "http://127.0.0.1:3765/api/node-context?path=.&node_id=$node_id&edge_limit=5" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!body.node || !Array.isArray(body.edges)) process.exit(1); });'
          find "$cache_dir" -maxdepth 1 -type f -name 'graph-*.json' | grep .

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Check web JavaScript syntax
        run: node --check crates/codegraph-web/static/app.js

      - name: Smoke scan CLI
        run: |
          cargo run -p codegraph-cli -- scan . --format ndjson > /tmp/codegraph.ndjson
          test -s /tmp/codegraph.ndjson
          grep '"record_type":"graph"' /tmp/codegraph.ndjson

      - name: Smoke server cache
        run: |
          cache_dir="$(mktemp -d)"
          cargo run -p codegraph-server -- --root . --port 3765 --cache-dir "$cache_dir" &
          server_pid="$!"
          trap 'kill "$server_pid"' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          first="$(curl -fsS 'http://127.0.0.1:3765/api/scan?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).cache.status));')"
          second="$(curl -fsS 'http://127.0.0.1:3765/api/scan?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).cache.status));')"
          test "$first" = "miss"
          test "$second" = "hit"
          curl -fsS 'http://127.0.0.1:3765/api/summary?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (typeof body.nodes !== "number" || !body.languages) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/entrypoints?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body)) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=10&kind=function' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || typeof body.total_nodes !== "number") process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/focus?path=.&node_ids=1&edge_limit=10' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || body.nodes.length < 1 || !Array.isArray(body.edges)) process.exit(1); });'
          curl -fsS 'http://127.0.0.1:3765/api/insights?path=.' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (typeof body.total !== "number" || !Array.isArray(body.insights)) process.exit(1); });'
          curl -fsS --get 'http://127.0.0.1:3765/api/query' --data-urlencode 'path=.' --data-urlencode 'q=edges confidence:heuristic limit:5' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.edges) || body.edges.some(edge => edge.confidence !== "heuristic")) process.exit(1); });'
          curl -fsS --get 'http://127.0.0.1:3765/api/query' --data-urlencode 'path=.' --data-urlencode 'q=path from:main to:scan_with_options depth:4' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!Array.isArray(body.nodes) || !Array.isArray(body.edges) || body.edges.length < 1) process.exit(1); });'
          fixture="$(mktemp -d "$PWD/codegraph-fixture.XXXXXX")"
          cat > "$fixture/main.rs" <<'RS'
          fn main() { service(); }
          fn service() { repository(); }
          fn repository() { main(); }
          RS
          curl -fsS "http://127.0.0.1:3765/api/insights?path=$fixture" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!body.insights.some(insight => insight.kind === "dependency_cycle")) process.exit(1); });'
          node_id="$(curl -fsS 'http://127.0.0.1:3765/api/graph?path=.&node_limit=1&kind=function' | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).nodes[0].id));')"
          curl -fsS "http://127.0.0.1:3765/api/node-context?path=.&node_id=$node_id&edge_limit=5" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const body = JSON.parse(input); if (!body.node || !Array.isArray(body.edges)) process.exit(1); });'
          find "$cache_dir" -maxdepth 1 -type f -name 'graph-*.json' | grep .

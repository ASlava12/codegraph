<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeGraph</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>CodeGraph</h1>
            <p id="rootLabel">No project loaded</p>
          </div>
          <span id="status" class="status">idle</span>
        </header>

        <section class="toolbar" aria-label="Scan controls">
          <label class="field project-field">
            <span>Project</span>
            <select id="projectSelect"></select>
          </label>
          <label class="field">
            <span>Path</span>
            <input id="pathInput" type="text" value="." autocomplete="off" />
          </label>
          <button id="scanButton" type="button">Scan</button>
        </section>

        <section class="stats" aria-label="Graph summary">
          <div><strong id="nodeCount">0</strong><span>Nodes</span></div>
          <div><strong id="edgeCount">0</strong><span>Edges</span></div>
          <div><strong id="callCount">0</strong><span>Calls</span></div>
          <div><strong id="envCount">0</strong><span>Env</span></div>
          <div><strong id="configCount">0</strong><span>Config</span></div>
          <div><strong id="errorCount">0</strong><span>Errors</span></div>
          <div><strong id="entryCount">0</strong><span>Entrypoints</span></div>
        </section>

        <section class="overview" aria-label="Project overview">
          <header>
            <h2>Overview</h2>
            <span id="overviewTotals">0 nodes</span>
          </header>
          <div id="languageList" class="language-list"></div>
          <div id="confidenceList" class="confidence-list"></div>
          <div id="relationList" class="relation-list"></div>
          <div id="edgeSourceList" class="edge-source-list"></div>
          <div id="annotationList" class="annotation-list"></div>
          <div id="entrypointList" class="entrypoint-list"></div>
        </section>

        <section class="entrypoint-flows" aria-label="Entrypoint flows">
          <header>
            <h2>Entry Flows</h2>
          </header>
          <div class="entrypoint-flow-fields">
            <label class="field compact">
              <span>Search</span>
              <input id="entryFlowSearchInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Depth</span>
              <input id="entryFlowDepthInput" type="number" min="1" max="32" value="3" />
            </label>
          </div>
          <button id="entryFlowButton" type="button">Trace Entrypoints</button>
          <div id="entryFlowResult" class="query-result"></div>
        </section>

        <section class="graph-page" aria-label="Graph page">
          <header>
            <h2>Graph Page</h2>
            <span id="pageInfo">0 / 0</span>
          </header>
          <div class="page-fields">
            <label class="field compact">
              <span>Nodes</span>
              <input id="nodeLimitInput" type="number" min="20" max="1000" value="250" />
            </label>
            <label class="field compact">
              <span>Edges</span>
              <input id="edgeLimitInput" type="number" min="1" max="2000" value="500" />
            </label>
            <label class="field compact">
              <span>Kind</span>
              <input id="serverKindInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Item</span>
              <input id="serverItemKindInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Language</span>
              <input id="serverLanguageInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Search</span>
              <input id="serverSearchInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Edge</span>
              <input id="serverEdgeKindInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Confidence</span>
              <input id="serverConfidenceInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Relation</span>
              <input id="serverEdgeRelationInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Source</span>
              <input id="serverEdgeSourceInput" type="text" autocomplete="off" />
            </label>
          </div>
          <div class="page-actions">
            <button id="pagePrevButton" type="button" aria-label="Previous graph page">&lt;</button>
            <button id="pageReloadButton" type="button">Apply</button>
            <button id="pageNextButton" type="button" aria-label="Next graph page">&gt;</button>
          </div>
        </section>

        <section class="query" aria-label="Graph query">
          <label class="field">
            <span>Query</span>
            <input id="queryInput" type="text" value="nodes kind:function label:main" autocomplete="off" />
          </label>
          <button id="queryButton" type="button">Run</button>
          <div id="queryResult" class="query-result"></div>
        </section>

        <section class="source-search" aria-label="Source search">
          <header>
            <h2>Source Search</h2>
          </header>
          <div class="source-search-fields">
            <label class="field compact">
              <span>Text</span>
              <input id="sourceSearchInput" type="search" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Path</span>
              <input id="sourcePathFilterInput" type="text" autocomplete="off" />
            </label>
          </div>
          <button id="sourceSearchButton" type="button">Search Source</button>
          <div id="sourceSearchResult" class="query-result"></div>
        </section>

        <section class="cache-diff" aria-label="Cache diagnostics">
          <header>
            <h2>Cache Diff</h2>
            <span id="cacheDiffStatus">idle</span>
          </header>
          <div class="cache-diff-fields">
            <label class="field compact">
              <span>Limit</span>
              <input id="cacheDiffLimitInput" type="number" min="1" max="10000" value="50" />
            </label>
          </div>
          <button id="cacheDiffButton" type="button">Explain Cache</button>
          <div id="cacheDiffResult" class="query-result"></div>
        </section>

        <section class="path-query" aria-label="Graph path">
          <header>
            <h2>Path</h2>
          </header>
          <div class="path-fields">
            <label class="field compact">
              <span>From</span>
              <input id="pathFromInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>To</span>
              <input id="pathToInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Depth</span>
              <input id="pathDepthInput" type="number" min="1" max="32" value="8" />
            </label>
            <label class="field compact">
              <span>Edge</span>
              <input id="pathEdgeKindInput" type="text" autocomplete="off" />
            </label>
          </div>
          <button id="pathButton" type="button">Find Path</button>
          <div id="pathResult" class="query-result"></div>
        </section>

        <section class="config-trace" aria-label="Configuration trace">
          <header>
            <h2>Config Trace</h2>
          </header>
          <div class="config-trace-fields">
            <label class="field compact">
              <span>Target</span>
              <input id="configTraceTargetInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Depth</span>
              <input id="configTraceDepthInput" type="number" min="1" max="32" value="6" />
            </label>
          </div>
          <button id="configTraceButton" type="button">Trace Config</button>
          <div id="configTraceResult" class="query-result"></div>
        </section>

        <section class="error-trace" aria-label="Error trace">
          <header>
            <h2>Error Trace</h2>
          </header>
          <div class="error-trace-fields">
            <label class="field compact">
              <span>Target</span>
              <input id="errorTraceTargetInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Depth</span>
              <input id="errorTraceDepthInput" type="number" min="1" max="32" value="6" />
            </label>
          </div>
          <button id="errorTraceButton" type="button">Trace Errors</button>
          <div id="errorTraceResult" class="query-result"></div>
        </section>

        <section class="insights" aria-label="Graph insights">
          <header>
            <h2>Insights</h2>
            <span id="insightCount">0</span>
          </header>
          <div class="insight-filters">
            <label class="field compact">
              <span>Severity</span>
              <input id="insightSeverityInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Kind</span>
              <input id="insightKindInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Search</span>
              <input id="insightSearchInput" type="text" autocomplete="off" />
            </label>
            <button id="insightFilterButton" type="button">Apply</button>
          </div>
          <div id="insightList" class="insight-list"></div>
        </section>

        <section class="filters" aria-label="Graph filters">
          <label class="field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" />
          </label>
          <div id="kindFilters" class="kind-filters"></div>
        </section>

        <section class="selection" aria-label="Selected node">
          <h2 id="selectionTitle">Selection</h2>
          <div id="selectionBody" class="selection-body"></div>
        </section>
      </aside>

      <section class="graph-stage" aria-label="Code graph">
        <div class="graph-controls" aria-label="Graph viewport controls">
          <div class="graph-control-group">
            <button id="zoomOutButton" type="button" aria-label="Zoom out">-</button>
            <button id="zoomInButton" type="button" aria-label="Zoom in">+</button>
            <button id="fitGraphButton" type="button" aria-label="Fit visible graph">Fit</button>
          </div>
          <div class="graph-control-group">
            <button id="resetLayoutButton" type="button" aria-label="Restart graph layout">Reset</button>
            <button id="toggleLayoutButton" type="button" aria-label="Pause graph layout">Pause</button>
          </div>
          <span id="viewportInfo" class="viewport-info">0 nodes</span>
        </div>
        <canvas id="graphCanvas"></canvas>
        <div class="legend" id="legend"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>

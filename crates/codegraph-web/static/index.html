<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeGraph</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>CodeGraph</h1>
            <p id="rootLabel">No project loaded</p>
          </div>
          <span id="status" class="status">idle</span>
        </header>

        <section class="toolbar" aria-label="Scan controls">
          <label class="field">
            <span>Path</span>
            <input id="pathInput" type="text" value="." autocomplete="off" />
          </label>
          <button id="scanButton" type="button">Scan</button>
        </section>

        <section class="stats" aria-label="Graph summary">
          <div><strong id="nodeCount">0</strong><span>Nodes</span></div>
          <div><strong id="edgeCount">0</strong><span>Edges</span></div>
          <div><strong id="callCount">0</strong><span>Calls</span></div>
          <div><strong id="envCount">0</strong><span>Env</span></div>
          <div><strong id="configCount">0</strong><span>Config</span></div>
          <div><strong id="errorCount">0</strong><span>Errors</span></div>
          <div><strong id="entryCount">0</strong><span>Entrypoints</span></div>
        </section>

        <section class="overview" aria-label="Project overview">
          <header>
            <h2>Overview</h2>
            <span id="overviewTotals">0 nodes</span>
          </header>
          <div id="languageList" class="language-list"></div>
          <div id="entrypointList" class="entrypoint-list"></div>
        </section>

        <section class="graph-page" aria-label="Graph page">
          <header>
            <h2>Graph Page</h2>
            <span id="pageInfo">0 / 0</span>
          </header>
          <div class="page-fields">
            <label class="field compact">
              <span>Nodes</span>
              <input id="nodeLimitInput" type="number" min="20" max="1000" value="250" />
            </label>
            <label class="field compact">
              <span>Edges</span>
              <input id="edgeLimitInput" type="number" min="1" max="2000" value="500" />
            </label>
            <label class="field compact">
              <span>Kind</span>
              <input id="serverKindInput" type="text" autocomplete="off" />
            </label>
            <label class="field compact">
              <span>Edge</span>
              <input id="serverEdgeKindInput" type="text" autocomplete="off" />
            </label>
          </div>
          <div class="page-actions">
            <button id="pagePrevButton" type="button" aria-label="Previous graph page">&lt;</button>
            <button id="pageReloadButton" type="button">Apply</button>
            <button id="pageNextButton" type="button" aria-label="Next graph page">&gt;</button>
          </div>
        </section>

        <section class="query" aria-label="Graph query">
          <label class="field">
            <span>Query</span>
            <input id="queryInput" type="text" value="nodes kind:function label:main" autocomplete="off" />
          </label>
          <button id="queryButton" type="button">Run</button>
          <div id="queryResult" class="query-result"></div>
        </section>

        <section class="insights" aria-label="Graph insights">
          <header>
            <h2>Insights</h2>
            <span id="insightCount">0</span>
          </header>
          <div id="insightList" class="insight-list"></div>
        </section>

        <section class="filters" aria-label="Graph filters">
          <label class="field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" />
          </label>
          <div id="kindFilters" class="kind-filters"></div>
        </section>

        <section class="selection" aria-label="Selected node">
          <h2 id="selectionTitle">Selection</h2>
          <div id="selectionBody" class="selection-body"></div>
        </section>
      </aside>

      <section class="graph-stage" aria-label="Code graph">
        <canvas id="graphCanvas"></canvas>
        <div class="legend" id="legend"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>

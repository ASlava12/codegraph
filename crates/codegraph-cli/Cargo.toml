[package]
name = "codegraph-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The clap command and every generated artifact (MCP config in install.rs, git
# hooks in hooks.rs, the docs) invoke the tool as `codegraph`, so the installed
# binary must be named `codegraph`, not the package name `codegraph-cli`.
[[bin]]
name = "codegraph"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
codegraph-analysis.workspace = true
codegraph-core.workspace = true
codegraph-indexer.workspace = true
codegraph-lsp.workspace = true
codegraph-parser.workspace = true
codegraph-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

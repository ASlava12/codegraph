[workspace]
resolver = "3"
members = [
    "crates/codegraph-analysis",
    "crates/codegraph-cli",
    "crates/codegraph-core",
    "crates/codegraph-indexer",
    "crates/codegraph-parser",
    "crates/codegraph-server",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ASlava12/codegraph"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
codegraph-analysis = { path = "crates/codegraph-analysis" }
codegraph-core = { path = "crates/codegraph-core" }
codegraph-indexer = { path = "crates/codegraph-indexer" }
codegraph-parser = { path = "crates/codegraph-parser" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"

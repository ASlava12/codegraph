[workspace]
resolver = "3"
members = [
    "crates/codegraph-analysis",
    "crates/codegraph-cli",
    "crates/codegraph-core",
    "crates/codegraph-indexer",
    "crates/codegraph-lsp",
    "crates/codegraph-parser",
    "crates/codegraph-server",
    "crates/codegraph-storage",
    "crates/codegraph-ui",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ASlava12/codegraph"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
codegraph-analysis = { path = "crates/codegraph-analysis" }
codegraph-core = { path = "crates/codegraph-core" }
codegraph-indexer = { path = "crates/codegraph-indexer" }
codegraph-lsp = { path = "crates/codegraph-lsp" }
codegraph-parser = { path = "crates/codegraph-parser" }
codegraph-storage = { path = "crates/codegraph-storage" }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1.1.2"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.26.0"
tree-sitter-swift = "0.7.3"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"
